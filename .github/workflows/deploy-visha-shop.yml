name: Deploy Visha Shop Apple-inspired UI (one-time guarded release)

on:
  create:
  push:
    branches:
      - release/visha-shop-apple-ui-20261106

permissions:
  contents: read

concurrency:
  group: visha-shop-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # New release branch only: this workflow must not deploy on unrelated pushes.
    if: >-
      github.ref == 'refs/heads/release/visha-shop-apple-ui-20261106' &&
      (github.event_name == 'create' || (github.event_name == 'push' && github.event.created == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SITE_LIVE: 'false'
      PUBLIC_AMAZON_ASSOCIATE_ACTIVE: 'false'
      RELEASE_MODE: editorial
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check scoped Cloudflare credentials (never print secrets)
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare Pages credentials are missing. Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; no deployment attempted."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Cloudflare account ID has an unexpected format. No deployment attempted."
            exit 1
          fi

      - name: Confirm existing Visha Shop Pages target before uploading
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch(
            'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/pages/projects/visha-shop',
            {headers:{Authorization:'Bearer ' + token}}
          );
          const payload = await response.json().catch(() => null);
          if (!response.ok || !payload?.success ||
              payload?.result?.name !== 'visha-shop' ||
              payload?.result?.subdomain !== 'visha-shop.pages.dev') {
            console.error('::error::Unable to verify existing Cloudflare Pages project visha-shop with exact visha-shop.pages.dev subdomain. Nothing deployed.');
            process.exit(1);
          }
          console.log('Verified existing Cloudflare Pages project: visha-shop.pages.dev');
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Astro validation, tests, build, and static audit
        run: npm run validate

      - name: Publish only to verified Visha Shop Pages project
        run: npx --yes wrangler@4 pages deploy ./dist --project-name=visha-shop --branch=main
